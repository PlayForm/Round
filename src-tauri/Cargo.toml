[package]
name = "Round"
version = "0.0.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tauri = { version = "2.11.0", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-store = "2.4.3"

[features]
custom-protocol = ["tauri/custom-protocol"]
default = []
