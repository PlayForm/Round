[workspace]
members = ["Crate/Round"]
resolver = "3"

[workspace.package]
version = "0.0.10"
edition = "2024"
# Tauri 2.12 requires 1.90, so this is the real floor. Declaring a lower one is
# not harmless: cargo's MSRV-aware resolver then locks older transitive crates
# ("locking 436 packages to highest Rust 1.88 compatible versions"), so CI would
# compile a different graph than a machine that ignores the field.
rust-version = "1.90"
license = "CC0-1.0"
# `authors` is deprecated cargo metadata (surfaced only through
# CARGO_PKG_AUTHORS for backwards compatibility); identity lives in the
# repository/homepage fields instead.
repository = "https://github.com/PlayForm/Round"
homepage = "https://github.com/PlayForm/Round#readme"

# Profiles live here, not in `.cargo/config.toml`: cargo only reads `[profile]`
# from a manifest, and a `[profile]` table in a config file is silently ignored.
[profile.dev]
incremental = true
debug = 0
strip = "debuginfo"
panic = "abort"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
codegen-units = 1
debug = false
lto = false
panic = "abort"
strip = false
