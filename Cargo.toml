[workspace]
members = ["Crate/Round"]
resolver = "3"

[workspace.package]
version = "0.0.9"
edition = "2024"
rust-version = "1.88"
license = "CC0-1.0"
# `authors` is deprecated cargo metadata (surfaced only through
# CARGO_PKG_AUTHORS for backwards compatibility); identity lives in the
# repository/homepage fields instead.
repository = "https://github.com/PlayForm/Round"
homepage = "https://github.com/PlayForm/Round#readme"

# Profiles live here, not in `.cargo/config.toml`: cargo only reads `[profile]`
# from a manifest, and a `[profile]` table in a config file is silently ignored.
[profile.dev]
incremental = true
debug = 0
strip = "debuginfo"
panic = "abort"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
codegen-units = 1
debug = false
lto = false
panic = "abort"
strip = false
