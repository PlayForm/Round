# House style: tab indentation, `name:Type` (no space after the colon), and a
# 120-column budget. `unstable_features` is safe because the toolchain is the
# floating nightly declared in rust-toolchain.toml.
array_width = 80
binop_separator = "Front"
brace_style = "PreferSameLine"
chain_width = 80
comment_width = 80
condense_wildcard_suffixes = true
control_brace_style = "AlwaysSameLine"
edition = "2024"
fn_call_width = 80
fn_single_line = true
force_explicit_abi = true
format_code_in_doc_comments = true
format_macro_bodies = true
format_strings = true
group_imports = "StdExternalCrate"
hard_tabs = true
imports_granularity = "Crate"
imports_layout = "HorizontalVertical"
indent_style = "Block"
match_arm_leading_pipes = "Never"
max_width = 120
merge_derives = true
newline_style = "Unix"
normalize_comments = true
reorder_impl_items = false
reorder_imports = false
reorder_modules = false
space_after_colon = false
struct_lit_width = 80
struct_variant_width = 80
tab_spaces = 4
trailing_comma = "Vertical"
type_punctuation_density = "Wide"
unstable_features = true
use_field_init_shorthand = true
use_small_heuristics = "Max"
use_try_shorthand = true
style_edition = "2024"
