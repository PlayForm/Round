[package]
name = "pround"
description = "A transparent, click-through overlay that draws rounded corners on every connected monitor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["tauri", "rounded", "overlay", "monitor", "tray"]
categories = ["gui"]

# `Package/Web/Target` is vite's output and is embedded into the binary at
# compile time. It lives outside the crate, so there is nothing to stage; the
# library target does not need it at all.
include = [
	"/Source/**",
	"/icons/**",
	"/capabilities/**",
	"/tauri.conf.json",
	"/build.rs",
]

[lib]
name = "pround"
path = "Source/Library.rs"

[[bin]]
name = "round"
path = "Source/Main.rs"

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.7", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-store = "2.5.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
	"Win32_Foundation",
	"Win32_Graphics_Dwm",
	"Win32_UI_WindowsAndMessaging",
] }

[features]
custom-protocol = ["tauri/custom-protocol"]
default = []
