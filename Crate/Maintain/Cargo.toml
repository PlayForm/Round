[package]
name = "round-maintain"
description = "Round's release CLI: one writer for the version, and the whole ceremony from a terminal."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# A tool for this repository, never a published crate.
publish = false

[lib]
name = "round_maintain"
path = "Source/Library.rs"

[[bin]]
name = "maintain"
path = "Source/Main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml_edit = "0.25"
