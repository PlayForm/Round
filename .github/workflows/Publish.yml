name: Publish

concurrency:
    group: Publish-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    id-token: write # crates.io trusted publishing (OIDC)

on:
    push:
        tags: ["Round/v*"]
    workflow_dispatch:
        inputs:
            publish_crates:
                description: "Attempt `cargo publish` of pround to crates.io"
                type: boolean
                default: false

env:
    ADBLOCK: true
    ASTRO_TELEMETRY_DISABLED: 1
    AUTOMATEDLAB_TELEMETRY_OPTOUT: 1
    AZURE_CORE_COLLECT_TELEMETRY: 0
    CARGO_TERM_COLOR: always
    CHOOSENIM_NO_ANALYTICS: 1
    DIEZ_DO_NOT_TRACK: 1
    DO_NOT_TRACK: 1
    DOTNET_CLI_TELEMETRY_OPTOUT: 1
    DOTNET_INTERACTIVE_CLI_TELEMETRY_OPTOUT: 1
    ET_NO_TELEMETRY: 1
    GATSBY_TELEMETRY_DISABLED: 1
    GATSBY_TELEMETRY_OPT_OUT: 1
    GATSBY_TELEMETRY_OPTOUT: 1
    GRIT_TELEMETRY_DISABLED: 1
    HASURA_GRAPHQL_ENABLE_TELEMETRY: false
    HINT_TELEMETRY: off
    HOMEBREW_NO_ANALYTICS: 1
    INFLUXD_REPORTING_DISABLED: true
    ITERATIVE_DO_NOT_TRACK: 1
    NEXT_TELEMETRY_DEBUG: 1
    NEXT_TELEMETRY_DISABLED: 1
    NG_CLI_ANALYTICS: false
    NUXT_TELEMETRY_DISABLED: 1
    PIN_DO_NOT_TRACK: 1
    POWERSHELL_TELEMETRY_OPTOUT: 1
    SAM_CLI_TELEMETRY: 0
    STNOUPGRADE: 1
    STRIPE_CLI_TELEMETRY_OPTOUT: 1
    TELEMETRY_DISABLED: 1
    TERRAFORM_TELEMETRY: 0
    VCPKG_DISABLE_METRICS: 1

jobs:
    # Runs on every `Round/v*` tag as well as on dispatch: whatever else happens,
    # the crate that could be published is inspected first.
    Verify:
        name: packaging guard + consumer probe
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Tauri system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                    libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

            - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
              with:
                  toolchain: nightly

            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cargo/registry/
                      ~/.cargo/git/
                      Target/
                  key:
                      cargo-publish-${{ runner.os }}-${{ hashFiles('Cargo.toml',
                      'Crate/**/Cargo.toml', 'rust-toolchain.toml') }}
                  restore-keys: cargo-publish-${{ runner.os }}-

            # `--list` does not build, which is the point: it answers "what would
            # crates.io receive" without a Node toolchain or the webview build. A
            # recursive exclude once stripped embedded files from a published crate in
            # this organisation; this step is why that cannot happen silently again.
            - name: Published tarball carries the crate
              run: |
                  set -euo pipefail
                  cargo package -p pround --list --allow-dirty > tarball.txt
                  for file in \
                    Source/Library.rs \
                    Source/Main.rs \
                    Source/Tray/mod.rs \
                    tauri.conf.json \
                    capabilities/default.json \
                    icons/tray.png \
                    README.md; do
                    grep -qxF "$file" tarball.txt || {
                      echo "::error::$file is missing from the published tarball"
                      exit 1
                    }
                  done
                  echo "packaging guard: $(wc -l < tarball.txt) files, all required entries present"

            # The published surface is the LIBRARY (`cargo add pround`). Prove it from
            # a throwaway consumer outside the workspace, before publishing: a broken
            # public path is not something a later consumer should discover.
            - name: Library consumer probe
              run: |
                  set -euo pipefail
                  cargo new --lib /tmp/probe
                  cd /tmp/probe
                  cargo add pround --path "$GITHUB_WORKSPACE/Crate/Round"
                  cat >> src/lib.rs <<'RS'
                  pub fn probe() -> pround::Settings::Struct::Struct {
                      let mut Settings = pround::Settings::Struct::Struct::default();

                      pround::Per::Set::Fn(
                          &mut Settings.Radius,
                          Some("probe"),
                          pround::Radius::Struct::Struct::from(23),
                      );

                      Settings
                  }
                  RS
                  cargo build

    Publish:
        name: Publish pround
        needs: [Verify]
        runs-on: ubuntu-latest
        environment: Release
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
              with:
                  toolchain: nightly

            - name: Read the version
              id: version
              run: |
                  set -euo pipefail
                  version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "pround") | .version')
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  echo "pround $version"

            # crates.io publishing is strictly opt-in: a plain `Round/v*` tag push does
            # NOT publish (that tag only triggers Build.yml's GitHub Release). Publish
            # happens only on an explicit `workflow_dispatch` with publish_crates=true,
            # so a tag-push release can never burn an immutable crates.io version.
            # Versions are immutable, so check the sparse index first and skip when
            # this one is already live.
            - name: Check if pround version is already published
              id: check
              if:
                  ${{ github.event_name == 'workflow_dispatch' &&
                  inputs.publish_crates }}
              run: |
                  set -euo pipefail
                  if curl -sL "https://index.crates.io/pr/ou/pround" | grep -q "\"vers\":\"${{ steps.version.outputs.version }}\""; then
                    echo "published=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "published=false" >> "$GITHUB_OUTPUT"
                  fi

            # Trusted publishing: GitHub's OIDC identity is exchanged for a short-lived
            # crates.io token, so no long-lived registry secret exists in this
            # repository. The crate's trusted publisher on crates.io must name this
            # repository, this workflow file and the `Release` environment.
            - name: Get crates.io publish token (trusted publishing)
              if:
                  ${{ github.event_name == 'workflow_dispatch' &&
                  inputs.publish_crates && steps.check.outputs.published ==
                  'false' }}
              uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
              id: auth

            # `--no-verify` is deliberate: the verification build compiles the `round`
            # binary, whose `tauri::generate_context!` reads `Package/Web/Target` - a
            # directory outside the package, built by the web job and embedded at
            # compile time. The library target, which is what `cargo add pround`
            # compiles, is covered by the consumer probe above.
            - name: Publish pround to crates.io (opt-in)
              if:
                  ${{ github.event_name == 'workflow_dispatch' &&
                  inputs.publish_crates && steps.check.outputs.published ==
                  'false' }}
              run: cargo publish -p pround --no-verify
              env:
                  CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
